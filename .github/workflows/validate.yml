# FILE: validate.yml
# DESCRIPTION: OpenTofu fmt/validate for changed (or all) modules on PRs to main.
# VERSION: 0.2.0
# AUTHORS: gh-platform

name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.8

      - name: Format check (repo)
        run: |
          set -euo pipefail
          tofu fmt -check -recursive

      - name: Validate each module directory
        run: |
          set -euo pipefail
          # Module = directory at repo root containing .tf files (exclude meta dirs)
          shopt -s nullglob
          failed=0
          for dir in */; do
            name="${dir%/}"
            case "${name}" in
              examples|modules|docs|.github) continue ;;
            esac
            if ! compgen -G "${name}/*.tf" > /dev/null; then
              continue
            fi
            echo "::group::validate ${name}"
            (
              cd "${name}"
              tofu init -backend=false -input=false
              tofu validate
            ) || failed=1
            echo "::endgroup::"
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::one or more modules failed validate"
            exit 1
          fi
