name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.8

      - name: Format check
        run: |
          set -euo pipefail
          tofu fmt -check -recursive

      - name: Init and validate example
        working-directory: examples/s3-bucket
        run: |
          set -euo pipefail
          tofu init -backend=false
          tofu validate
