# FILE_NAME: validate.yml
# DESCRIPTION: OpenTofu fmt/validate for changed modules only (dorny/paths-filter).
# VERSION: 0.3.0
# AUTHORS: gh-platform

name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_modules:
        description: Validate every root module (ignore path filter)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.resolve.outputs.modules }}
      any: ${{ steps.resolve.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect changed paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.all_modules) }}
        with:
          list-files: json
          filters: |
            module_tf:
              - '**/*.tf'
              - '**/*.tftest.hcl'

      - name: Resolve module directories to validate
        id: resolve
        env:
          ALL_MODULES: ${{ github.event_name == 'workflow_dispatch' && inputs.all_modules }}
          MODULE_TF_CHANGED: ${{ steps.filter.outputs.module_tf }}
          CHANGED_FILES_JSON: ${{ steps.filter.outputs.module_tf_files }}
        run: |
          set -euo pipefail

          is_module_dir() {
            local name="$1"
            case "${name}" in
              examples|modules|docs|.github|tests) return 1 ;;
            esac
            [[ -d "${name}" ]] || return 1
            compgen -G "${name}/*.tf" > /dev/null
          }

          modules=()

          if [[ "${ALL_MODULES}" == "true" ]]; then
            shopt -s nullglob
            for dir in */; do
              name="${dir%/}"
              if is_module_dir "${name}"; then
                modules+=("${name}")
              fi
            done
          elif [[ "${MODULE_TF_CHANGED:-}" == "true" ]]; then
            mapfile -t files < <(python3 -c 'import json,os; print("\n".join(json.loads(os.environ["CHANGED_FILES_JSON"])))')
            declare -A seen=()
            for f in "${files[@]}"; do
              # Only root-level module trees: <module>/** — ignore tests/, docs/, examples/, etc.
              top="${f%%/*}"
              if [[ "${top}" == "${f}" ]]; then
                # loose .tf at repo root (none expected) — skip
                continue
              fi
              if is_module_dir "${top}" && [[ -z "${seen[$top]+x}" ]]; then
                seen[$top]=1
                modules+=("${top}")
              fi
            done
            IFS=$'\n' modules=($(printf '%s\n' "${modules[@]}" | sort -u))
          fi

          if [[ "${#modules[@]}" -eq 0 ]]; then
            echo "any=false" >> "${GITHUB_OUTPUT}"
            echo "modules=[]" >> "${GITHUB_OUTPUT}"
            echo "No module directories to validate."
            exit 0
          fi

          json=$(printf '%s\n' "${modules[@]}" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "any=true" >> "${GITHUB_OUTPUT}"
          echo "modules=${json}" >> "${GITHUB_OUTPUT}"
          echo "Modules to validate: ${json}"

  fmt-validate:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.10

      - name: Format check (module)
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          tofu fmt -check -recursive

      - name: Validate module
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          tofu init -backend=false -input=false
          tofu validate
