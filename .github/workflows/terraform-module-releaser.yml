# FILE: terraform-module-releaser.yml
# DESCRIPTION: Per-module SemVer tags/releases via techpivot/terraform-module-releaser.
# VERSION: 0.1.0
# AUTHORS: gh-platform

name: Terraform Module Releaser

on:
  pull_request:
    types: [opened, reopened, synchronize, closed] # closed required for publish
    branches: [main]

permissions:
  contents: write # tags, releases, wiki
  pull-requests: write # release-plan PR comments

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Terraform Module Releaser
        uses: techpivot/terraform-module-releaser@5f3fc036202008b9a2d3ab5dbb1e4a734cd90e4d # v2.2.0
        with:
          semver-mode: conventional-commits
          default-semver-level: patch
          default-first-tag: v1.0.0
          # Flat module dirs at repo root; ignore scaffold/docs/examples (incl. nested).
          module-path-ignore: >-
            examples,
            examples/**,
            **/examples,
            **/examples/**,
            modules,
            modules/**,
            docs,
            docs/**,
            tests,
            tests/**
          module-change-exclude-patterns: >-
            .gitignore,*.md,docs/**,examples/**,*.tftest.hcl,tests/**
          module-asset-exclude-patterns: >-
            .gitignore,*.md,docs/**,examples/**,*.tftest.hcl,tests/**
          tag-directory-separator: /
          use-version-prefix: true
          # Wiki Home page initialized; releaser maintains module wiki pages.
          disable-wiki: false
          disable-branding: true
          hide-no-changes-pr-comment: true
