# Local Floci emulator for module tests.
# Usage: docker compose -f tests/floci/compose.yaml up -d
services:
  floci:
    image: floci/floci:1.5.34@sha256:b3b3a70a294b8ba8095385b8571ea1e4d44d494950d98de5e812cd9de02f506b
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_PARITY: "true"
